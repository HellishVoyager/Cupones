<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cuponera del Amor</title>
<style>
  :root{
    --bg1: #fff0f6;
    --pink: #ff4d6d;
    --soft-pink: #ffd7ea;
    --card: #fff;
    --green: #28a745;
    --red: #cc0033;
    --muted: #7b7b82;
  }
  html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fffafc 0%,#ffe6ec 100%);color:#222}
  /* ---------- START SCREEN ---------- */
  .start-screen{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#ffd9e6 0%,#ffbcd6 100%);z-index:40;transition:opacity .6s ease;
  }
  .start-title{
    font-size:clamp(24px,5.2vw,48px);
    color:white;text-align:center;font-weight:800;letter-spacing:0.6px;
    text-shadow:0 6px 18px rgba(0,0,0,0.12);
    display:flex;align-items:center;gap:12px;
  }
  .start-heart{font-size: clamp(34px,6.5vw,64px); transform:translateY(0)}
  .enter-btn{
    margin-top:22px;background:var(--pink);color:#fff;border:0;padding:14px 28px;border-radius:14px;font-size:18px;cursor:pointer;box-shadow:0 8px 18px rgba(255,77,109,0.2)
  }
  .enter-btn:active{transform:translateY(1px)}
  /* big floating hearts */
  .big-heart{position:absolute;color:#fff;opacity:.9;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.12));animation:bigFloat 6s linear infinite}
  @keyframes bigFloat{0%{transform:translateY(120vh) scale(1)}100%{transform:translateY(-30vh) scale(1.4);opacity:0}}
  /* ---------- MAIN CONTENT ---------- */
  .main{display:none;padding:18px 12px 80px;max-width:1100px;margin:0 auto}
  .header{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:6px}
  .site-title{font-size:22px;color:var(--pink);font-weight:800;display:flex;gap:8px;align-items:center}
  .site-heart{font-size:22px;cursor:pointer;user-select:none}
  .floating-heart{position:fixed;bottom:-20px;color:var(--pink);font-size:18px;opacity:.7;animation:float 5s linear infinite;pointer-events:none}
  @keyframes float{0%{transform:translateY(0) translateX(0);opacity:1}100%{transform:translateY(-120vh) translateX(30px);opacity:0}}
  /* grid */
  .grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .card{
    background:var(--card);border-radius:14px;padding:12px;border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 8px 20px rgba(13,13,16,0.04);display:flex;flex-direction:column;align-items:center;
    transition:transform .12s ease,opacity .18s ease;
  }
  .card.agotado{opacity:.55;transform:translateY(2px)}
  .cup-title{font-weight:700;color:#222;text-align:center;font-size:15px;margin:8px 0}
  .cup-sub{font-size:13px;color:var(--muted);margin-bottom:8px}
  .btn-claim{width:100%;padding:10px 12px;border-radius:10px;border:0;background:var(--green);color:#fff;font-weight:800;cursor:pointer;font-size:14px}
  .btn-claim.confirm{background:#e6b800} /* yellowish for confirm stage */
  .status-msg{margin-top:8px;font-weight:800}
  .status-agotado{color:var(--red);font-weight:900;font-size:14px;letter-spacing:.6px}
  .thanks{color:#d10034;font-weight:800;text-align:center;margin-top:8px}
  /* admin panel (hidden until triggered) */
  .admin-panel{display:none;background:#fff;padding:10px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);margin-top:16px;box-shadow:0 10px 26px rgba(0,0,0,0.06)}
  .admin-list{display:flex;flex-wrap:wrap;gap:8px;padding:6px}
  .admin-btn{padding:6px 10px;background:#ff7675;border:0;color:#fff;border-radius:8px;cursor:pointer;font-weight:700}
  /* responsive tweaks */
  @media (max-width:480px){
    .cup-title{font-size:14px}
    .btn-claim{font-size:13px}
    .site-title{font-size:18px}
  }
</style>
</head>
<body>

<!-- HIDDEN LOCAL PATH (optional; uploaded file you used earlier) -->
<!-- file path for optional use: /mnt/data/30182b92-c7d6-4720-a54d-db6222001c39.png -->

<!-- START SCREEN -->
<section id="start" class="start-screen">
  <div class="start-title" aria-hidden="false">
    <span style="display:flex;flex-direction:column;align-items:center">
      <span style="font-size:14px;color:rgba(255,255,255,0.95);font-weight:700">Bienvenida a</span>
      <span style="font-size:34px;line-height:1;color:#fff;font-weight:900">Cuponera del Amor</span>
    </span>
    <span class="start-heart" aria-hidden="true">❤</span>
  </div>

  <button id="enterBtn" class="enter-btn" aria-label="Ingresar a la cuponera">Ingresar</button>

  <!-- big hearts (decorative) -->
  <div class="big-heart" style="left:6vw; animation-delay:0s">❤</div>
  <div class="big-heart" style="left:40vw; animation-delay:1s; font-size:48px">💗</div>
  <div class="big-heart" style="left:72vw; animation-delay:2s; font-size:56px">💖</div>
</section>

<!-- MAIN CONTENT -->
<main id="app" class="main" aria-hidden="true">
  <header class="header">
    <div class="site-title">
      <span style="font-size:18px">Cuponera del Amor</span>
      <span id="titleHeart" class="site-heart" title="presiona 3 veces para opciones">❤</span>
    </div>
  </header>

  <!-- floating decorative hearts -->
  <div id="heartsContainer" aria-hidden="true"></div>

  <!-- coupons grid -->
  <section class="grid" id="grid"></section>

  <!-- admin panel (hidden by default) -->
  <div id="adminPanel" class="admin-panel" aria-hidden="true">
    <div style="font-weight:800;color:#222;margin-bottom:8px">Panel secreto — Re-stock individual</div>
    <div class="admin-list" id="adminList"></div>
  </div>
</main>

<script>
/* ===========================
   Datos: Nombres reales de los 14 cupones
   =========================== */
const NOMBRES = [
  "Para una tarde de películas",
  "Para una tarde de videojuegos",
  "Para pintar cuadros",
  "Para un día de skin care",
  "Para un masaje con final feliz",
  "Para consentirte un día",
  "Válido por 20 abrazos",
  "Para un regalo",
  "Por un día hacer lo que quieras",
  "Por un besito",
  "Para ir al cine",
  "Compras en Temu",
  "Comprarte lo que quieras",
  "Repetir cualquier cupón"
];

/* localStorage keys */
const LS_KEY = "cuponera_estados_v2";

/* load states or initialize */
let estados = {}; // values: "available" | "confirm" | "redeemed"
const saved = localStorage.getItem(LS_KEY);
if(saved){
  try{ estados = JSON.parse(saved); }catch(e){ estados = {}; }
}
NOMBRES.forEach((_,i)=>{ if(!(i in estados)) estados[i] = "available"; });

/* DOM refs */
const start = document.getElementById("start");
const enterBtn = document.getElementById("enterBtn");
const app = document.getElementById("app");
const grid = document.getElementById("grid");
const heartsContainer = document.getElementById("heartsContainer");
const titleHeart = document.getElementById("titleHeart");
const adminPanel = document.getElementById("adminPanel");
const adminList = document.getElementById("adminList");

/* show start -> main transition */
enterBtn.addEventListener("click", () => {
  start.style.opacity = 0;
  setTimeout(()=> { start.style.display = "none"; openMain(); }, 600);
});

function openMain(){
  app.style.display = "block";
  app.setAttribute("aria-hidden","false");
  renderGrid();
}

/* render coupons */
function renderGrid(){
  grid.innerHTML = "";
  NOMBRES.forEach((nombre, idx) => {
    const state = estados[idx] || "available";
    const card = document.createElement("article");
    card.className = "card" + (state === "redeemed" ? " agotado" : "");
    card.setAttribute("data-idx",idx);

    const content = document.createElement("div");
    content.style.width = "100%";
    content.style.display = "flex";
    content.style.flexDirection = "column";
    content.style.alignItems = "center";

    const title = document.createElement("div");
    title.className = "cup-title";
    title.textContent = nombre;

    const sub = document.createElement("div");
    sub.className = "cup-sub";
    sub.textContent = state === "available" ? "Stock: 1 disponible" : (state === "confirm" ? "Presiona confirmar para canjear" : "");

    const btn = document.createElement("button");
    btn.className = "btn-claim";
    btn.id = "btn_" + idx;

    if(state === "available"){
      btn.textContent = "Canjear";
      btn.classList.remove("confirm");
      btn.disabled = false;
    } else if(state === "confirm"){
      btn.textContent = "Confirmar";
      btn.classList.add("confirm");
      btn.disabled = false;
    } else if(state === "redeemed"){
      btn.style.display = "none";
    }

    const status = document.createElement("div");
    status.className = "status-msg";
    if(state === "redeemed"){
      status.innerHTML = '<div class="thanks">Gracias por canjear tu cupón! ❤️</div><div class="status-agotado">AGOTADO</div>';
    }

    /* handle click behavior */
    btn.addEventListener("click", () => {
      const cur = estados[idx];
      if(cur === "available"){
        estados[idx] = "confirm";
        saveAndRerender();
      } else if(cur === "confirm"){
        // Show thanks message briefly then mark redeemed
        estados[idx] = "redeemed";
        saveAndRerender();
      }
    });

    /* admin re-stock small button inside card (hidden visually, admin panel will do restock) */
    // assemble
    content.appendChild(title);
    content.appendChild(sub);
    content.appendChild(btn);
    content.appendChild(status);
    card.appendChild(content);
    grid.appendChild(card);
  });

  renderAdminList();
}

/* save to localStorage */
function saveAndRerender(){
  localStorage.setItem(LS_KEY, JSON.stringify(estados));
  renderGrid();
}

/* admin functions: build list of restock buttons */
function renderAdminList(){
  adminList.innerHTML = "";
  NOMBRES.forEach((n,i)=>{
    const b = document.createElement("button");
    b.className = "admin-btn";
    b.textContent = `${i+1}. ${n}`;
    b.addEventListener("click", ()=>{
      if(confirm(`Restablecer "${n}" a Disponible?`)){
        estados[i] = "available";
        saveAndRerender();
      }
    });
    adminList.appendChild(b);
  });
}

/* secret: show admin panel after 3 quick clicks on titleHeart */
let clicks = [];
titleHeart.addEventListener("click", ()=>{
  const now = Date.now();
  clicks.push(now);
  if(clicks.length>3) clicks.shift();
  if(clicks.length===3 && (clicks[2]-clicks[0])<700){
    if(adminPanel.style.display === "block"){
      adminPanel.style.display = "none";
      adminPanel.setAttribute("aria-hidden","true");
    } else {
      adminPanel.style.display = "block";
      adminPanel.setAttribute("aria-hidden","false");
      adminPanel.scrollIntoView({behavior:"smooth",block:"center"});
    }
  }
});

/* create floating decorative hearts continuously */
function createFloatingHeart(){
  const el = document.createElement("div");
  el.className = "floating-heart";
  el.textContent = ["❤","💗","💖"][Math.floor(Math.random()*3)];
  el.style.left = (Math.random()*90) + "vw";
  el.style.fontSize = (12 + Math.random()*20) + "px";
  heartsContainer.appendChild(el);
  setTimeout(()=> el.remove(),5200);
}
setInterval(createFloatingHeart,450);

/* ensure main hides on load; show start screen */
(function init(){
  app.style.display = "none";
  adminPanel.style.display = "none";
  renderGrid();
})();

/* optional: expose reset from console if you need */
window.resetAllCupones = function(){
  NOMBRES.forEach((_,i)=> estados[i] = "available");
  saveAndRerender();
};

</script>
</body>
</html>
