<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cuponera del Amor — Premium</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fff8fb; --bg2:#fff0f6; --accent:#ff5a7a; --accent-2:#ffb3c6; --card:#ffffff;
    --muted:#7b7b82; --glass: rgba(255,255,255,0.65);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter, Arial, Helvetica, sans-serif;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);color:#141214;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  /* HERO / START */
  .start-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:linear-gradient(180deg, rgba(255,90,122,0.08), rgba(255,179,198,0.06));z-index:60}
  .hero-card{width:100%;max-width:920px;background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.7));border-radius:18px;padding:28px;border:1px solid rgba(0,0,0,0.04);box-shadow:0 18px 50px rgba(15,15,20,0.06);display:flex;gap:20px;align-items:center}
  .hero-left{flex:1}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:Fraunces,serif;font-size:28px;box-shadow:0 8px 26px rgba(255,90,122,0.18)}
  .title{font-family:Fraunces, serif;font-size:28px;margin:6px 0 0;color:#3a1222}
  .subtitle{color:var(--muted);margin-top:6px}
  .enter-btn{margin-top:16px;padding:12px 20px;border-radius:12px;border:0;background:linear-gradient(90deg,var(--accent),#ff7a91);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,90,122,0.14)}
  .enter-btn:active{transform:translateY(1px)}
  .hero-right{width:260px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .heart-big{font-size:44px}
  /* MAIN */
  main{display:none;padding:20px;max-width:1100px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .site-left{display:flex;align-items:center;gap:12px}
  .site-title{font-family:Fraunces, serif;color:#3a1222;font-size:20px;font-weight:700}
  .site-heart{font-size:20px;color:var(--accent);cursor:pointer;user-select:none}
  .controls{display:flex;gap:8px;align-items:center}
  .small-btn{padding:8px 10px;border-radius:10px;border:0;background:var(--card);box-shadow:0 8px 18px rgba(13,13,16,0.04);cursor:pointer;font-weight:700}
  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
  .card{background:var(--card);padding:14px;border-radius:14px;border:1px solid rgba(0,0,0,0.04);box-shadow:0 10px 26px rgba(13,13,16,0.04);display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden}
  .cup-emoji{font-size:30px;margin-bottom:6px}
  .cup-title{font-weight:800;text-align:center;color:#2b1b23;margin-bottom:6px}
  .cup-desc{font-size:13px;color:var(--muted);margin-bottom:12px;text-align:center}
  .btn-claim{width:100%;padding:10px;border-radius:10px;border:0;background:linear-gradient(90deg,#5ec46b,#28a745);color:#fff;font-weight:800;cursor:pointer}
  .btn-confirm{background:linear-gradient(90deg,#ffcf5e,#e6b800);}
  .card.agotado{opacity:.6;transform:scale(.995)}
  .status{position:absolute;left:10px;top:10px;padding:6px 8px;border-radius:10px;background:rgba(255,90,122,0.06);font-weight:700;color:#d43a5a;font-size:12px}
  /* modal */
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,10,10,0.25);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s linear}
  .modal.show{opacity:1;pointer-events:auto}
  .modal-card{width:100%;max-width:560px;background:linear-gradient(180deg,#fff,#fff);border-radius:14px;padding:18px;border:1px solid rgba(0,0,0,0.06);box-shadow:0 26px 72px rgba(13,13,16,0.12);text-align:center}
  .modal-title{font-family:Fraunces, serif;font-size:20px;margin-bottom:8px}
  .modal-desc{color:var(--muted);margin-bottom:12px}
  .big-confirm{padding:12px 16px;border-radius:12px;border:0;background:linear-gradient(90deg,#ff6b86,#ff2d6b);color:#fff;font-weight:800;cursor:pointer}
  /* confetti canvas */
  #confetti{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:90}
  /* admin panel hidden */
  .admin-panel{display:none;background:var(--card);padding:12px;border-radius:12px;border:1px solid rgba(0,0,0,0.04);box-shadow:0 12px 38px rgba(13,13,16,0.06);margin-top:16px}
  .admin-list{display:flex;flex-wrap:wrap;gap:8px}
  .admin-btn{padding:8px 10px;border-radius:8px;border:0;background:linear-gradient(90deg,#ff7a91,#ff4d6d);color:#fff;font-weight:700;cursor:pointer}
  /* responsive */
  @media (max-width:560px){.hero-card{flex-direction:column;align-items:flex-start}.hero-right{width:100%}.title{font-size:22px}.logo{width:54px;height:54px}}
</style>
</head>
<body>
<!-- CONFETTI CANVAS -->
<canvas id="confetti"></canvas>
<!-- START HERO -->
<section id="start" class="start-screen">
  <div class="hero-card">
    <div class="hero-left">
      <div class="brand">
        <div class="logo">❤</div>
        <div>
          <div class="title">Cuponera del Amor</div>
          <div class="subtitle">Detalles románticos, sorpresas para ti</div>
        </div>
      </div>
      <div style="margin-top:12px;color:var(--muted)">Una colección de pequeños gestos para ti.</div>
      <button id="enterBtn" class="enter-btn">Entrar a la cuponera</button>
    </div>
    <div class="hero-right">
      <div class="heart-big">💗</div>
      <div style="font-weight:700;color:var(--muted);text-align:center">Lista para momentos inolvidables</div>
    </div>
  </div>
</section>

<!-- MAIN CONTENT -->
<main id="app" aria-hidden="true">
  <header>
    <div class="site-left">
      <div class="site-title">Cuponera del Amor</div>
      <div id="titleHeart" class="site-heart" title="Toca 3 veces para abrir opciones">❤</div>
    </div>
    <div class="controls">
      <button id="resetView" class="small-btn" title="Ver cupones restantes">Ver estado</button>
      <button id="helpBtn" class="small-btn">Ayuda</button>
    </div>
  </header>

  <section class="grid" id="grid"></section>

  <div id="adminPanel" class="admin-panel" aria-hidden="true">
    <div style="font-weight:800;color:#222;margin-bottom:8px">Panel secreto — Re-stock</div>
    <div class="admin-list" id="adminList"></div>
  </div>

</main>

<!-- Modal confirm -->
<div id="modal" class="modal" role="dialog" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Confirmar canje</div>
    <div class="modal-desc" id="modalDesc">¿Deseas canjear este cupón?</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:12px">
      <button id="modalCancel" class="small-btn">Cancelar</button>
      <button id="modalConfirm" class="big-confirm">Sí, canjear</button>
    </div>
  </div>
</div>

<script>
/* ==================== CONFIG ==================== */
const WEBHOOK_URL = "https://discord.com/api/webhooks/1443241851032309854/c-DNoO_Dr8WEDAKtxfrCIt4GALrC_SZDZLqNXgQvrYyFSzC6z98e3wxsYkiRkoXUjlmk"; // tu webhook ya incluido
const LS_KEY = 'cuponera_premium_v1';

/* ==================== DATA (14 cupones) ==================== */
const COUPONS = [
  {emoji:'🎬',title:'Para una tarde de películas',desc:'Palomitas y sofá'},
  {emoji:'🎮',title:'Para una tarde de videojuegos',desc:'Tu elección de juego'},
  {emoji:'🎨',title:'Para pintar cuadros',desc:'Pintura y lienzos'},
  {emoji:'🧖‍♀️',title:'Para un día de skin care',desc:'Tiempo de mimos'},
  {emoji:'💆‍♂️',title:'Para un masaje con final feliz',desc:'Relajación total'},
  {emoji:'🍰',title:'Para consentirte un día',desc:'Dulces y detalles'},
  {emoji:'🤗',title:'Válido por 20 abrazos',desc:'Abrazos interminables'},
  {emoji:'🎁',title:'Para un regalo',desc:'Sorpresa especial'},
  {emoji:'🌞',title:'Por un día hacer lo que quieras',desc:'Tu día, tus reglas'},
  {emoji:'💋',title:'Por un besito',desc:'Beso dulce'},
  {emoji:'🎞️',title:'Para ir al cine',desc:'Palomitas y pantalla grande'},
  {emoji:'🛍️',title:'Compras en Temu',desc:'nos vamos de compras enana'},
  {emoji:'💳',title:'Comprarte lo que quieras',desc:'Capricho permitido'},
  {emoji:'🔁',title:'Repetir cualquier cupón',desc:'Repite tu favorito'}
];

/* ==================== STATE ==================== */
let state = {}; // index => 'available'|'confirm'|'redeemed'
const saved = localStorage.getItem(LS_KEY);
if(saved){ try{ state = JSON.parse(saved); }catch(e){ state = {}; }}
COUPONS.forEach((_,i)=>{ if(!(i in state)) state[i] = 'available'; });

/* DOM refs */
const start = document.getElementById('start');
const enterBtn = document.getElementById('enterBtn');
const app = document.getElementById('app');
const grid = document.getElementById('grid');
const titleHeart = document.getElementById('titleHeart');
const adminPanel = document.getElementById('adminPanel');
const adminList = document.getElementById('adminList');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const modalConfirm = document.getElementById('modalConfirm');
const modalCancel = document.getElementById('modalCancel');
const confettiCanvas = document.getElementById('confetti');

/* enter */
enterBtn.addEventListener('click', ()=>{ start.style.display='none'; openMain(); });
function openMain(){ app.style.display='block'; app.setAttribute('aria-hidden','false'); renderGrid(); }

/* render grid */
function renderGrid(){ grid.innerHTML=''; COUPONS.forEach((c,i)=>{
  const s = state[i];
  const card = document.createElement('article'); card.className='card'+(s==='redeemed'?' agotado':'');
  const emoji = document.createElement('div'); emoji.className='cup-emoji'; emoji.textContent=c.emoji;
  const t = document.createElement('div'); t.className='cup-title'; t.textContent=c.title;
  const d = document.createElement('div'); d.className='cup-desc'; d.textContent=c.desc;
  const btn = document.createElement('button'); btn.className='btn-claim'; btn.id='btn_'+i;
  const status = document.createElement('div'); status.className='status';
  if(s==='available'){ btn.textContent='Canjear'; status.textContent='Disponible'; }
  else if(s==='confirm'){ btn.textContent='Confirmar'; btn.classList.add('btn-confirm'); status.textContent='Confirmación pendiente'; }
  else if(s==='redeemed'){ btn.style.display='none'; status.textContent='Canjeado'; }

  btn.addEventListener('click', ()=>{
    if(state[i]==='available'){ state[i]='confirm'; saveState(); }
    else if(state[i]==='confirm'){ // open modal to confirm
      showModal(i);
    }
  });

  card.appendChild(status); card.appendChild(emoji); card.appendChild(t); card.appendChild(d); card.appendChild(btn);
  grid.appendChild(card);
});
renderAdminList(); }

/* save */
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); renderGrid(); }

/* modal handling */
let currentIndex = null;
function showModal(index){ currentIndex = index; modalTitle.textContent = 'Confirmar canje'; modalDesc.textContent = `¿Deseas canjear: "${COUPONS[index].title}" ?`;
 modal.classList.add('show'); modal.setAttribute('aria-hidden','false'); }
modalCancel.addEventListener('click', ()=>{ modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); currentIndex=null; });
modalConfirm.addEventListener('click', ()=>{
  if(currentIndex===null) return; state[currentIndex] = 'redeemed'; saveState(); modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); triggerEffects(currentIndex); sendDiscord(currentIndex); currentIndex=null;
});

/* admin panel render */
function renderAdminList(){ adminList.innerHTML=''; COUPONS.forEach((c,i)=>{
  const b = document.createElement('button'); b.className='admin-btn'; b.textContent = `${i+1}. ${c.title}`;
  b.addEventListener('click', ()=>{
    if(confirm(`Restablecer "${c.title}" a Disponible?`)){
      state[i] = 'available'; saveState(); alert('Restablecido.');
    }
  });
  adminList.appendChild(b);
}); }

/* secret: show admin after 3 quick taps */
let clicks=[]; titleHeart.addEventListener('click', ()=>{ const now=Date.now(); clicks.push(now); if(clicks.length>3) clicks.shift(); if(clicks.length===3 && (clicks[2]-clicks[0])<700){
  if(adminPanel.style.display==='block'){ adminPanel.style.display='none'; adminPanel.setAttribute('aria-hidden','true'); }
  else{ adminPanel.style.display='block'; adminPanel.setAttribute('aria-hidden','false'); adminPanel.scrollIntoView({behavior:'smooth',block:'center'}); }
}});

/* effects: confetti + sound */
function triggerEffects(idx){ launchConfetti(); playPop(); showToast(`Canjeado: ${COUPONS[idx].title}`); }

/* simple toast */
function showToast(text){ const el = document.createElement('div'); el.style.position='fixed'; el.style.right='18px'; el.style.bottom='18px'; el.style.background='linear-gradient(90deg,#ff7a91,#ff4d6d)'; el.style.color='#fff'; el.style.padding='10px 14px'; el.style.borderRadius='12px'; el.style.boxShadow='0 10px 30px rgba(0,0,0,0.12)'; el.style.fontWeight='700'; el.textContent=text; document.body.appendChild(el); setTimeout(()=> el.style.opacity='0',2200); setTimeout(()=> el.remove(),2600); }

/* minimal confetti implementation */
const confettiCtx = confettiCanvas.getContext('2d');
function resizeCanvas(){ confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();
let confettiPieces = [];
function launchConfetti(){ confettiPieces = []; const count = 90; for(let i=0;i<count;i++){ confettiPieces.push({x:Math.random()*confettiCanvas.width, y:-Math.random()*confettiCanvas.height, r:4+Math.random()*8, d:Math.random()*50+2, tilt:Math.random()*20-10, color:['#ff6b86','#ffd1df','#ffd27a','#ff9fbf'][Math.floor(Math.random()*4)], vx:(Math.random()-0.5)*6, vy:2+Math.random()*6, ttl:200}); }
 animateConfetti(); }
let confettiRAF=null;
function animateConfetti(){ if(confettiRAF) cancelAnimationFrame(confettiRAF); function frame(){ confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
 confettiPieces.forEach((p)=>{ p.x += p.vx; p.y += p.vy; p.tilt += 0.5; p.vy += 0.03; p.ttl--; confettiCtx.fillStyle = p.color; confettiCtx.beginPath(); confettiCtx.ellipse(p.x, p.y, p.r, p.r*0.6, p.tilt*Math.PI/180, 0, Math.PI*2); confettiCtx.fill(); });
 confettiPieces = confettiPieces.filter(p=>p.ttl>0 && p.y < confettiCanvas.height + 100);
 if(confettiPieces.length>0) confettiRAF = requestAnimationFrame(frame); else cancelAnimationFrame(confettiRAF);
 }
 frame(); }

/* sound using WebAudio */
function playPop(){ try{ const ctx = new (window.AudioContext||window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.type='sine'; o.frequency.value=880; g.gain.value=0.0001; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28); o.stop(ctx.currentTime + 0.3);}catch(e){}
}

/* Device friendly detection */
function detectDevice(){ const ua = navigator.userAgent || navigator.vendor || window.opera; if(/android/i.test(ua)) return 'Móvil (Android)'; if(/iPhone|iPad|iPod/i.test(ua)) return 'Móvil (iOS)'; return 'Escritorio'; }

/* send discord notification (informativo con fecha/hora y dispositivo) */
function sendDiscord(index){
  const coupon = COUPONS[index];
  const now = new Date();
  const fecha = now.toLocaleDateString();
  const hora = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const dispositivo = detectDevice();
  const content = `💖 *Cupón canjeado* 💖\n**Cupón:** ${coupon.title}\n**Fecha:** ${fecha}\n**Hora:** ${hora}\n**Dispositivo:** ${dispositivo}\n**Estado:** CANJEADO ✔️`;
  // POST to webhook
  fetch(WEBHOOK_URL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content})}).catch(e=>{console.warn('No se pudo enviar webhook',e)});
}

/* small helpers */
function clearAll(){ if(confirm('Resetear todos los cupones a Disponible?')){ COUPONS.forEach((_,i)=>state[i]='available'); saveState(); alert('Todos restablecidos'); }}

/* init */
(function init(){ app.style.display='none'; renderGrid(); document.getElementById('resetView').addEventListener('click', ()=>{ let count=0; Object.values(state).forEach(s=>{ if(s==='available') count++; }); alert(count + ' cupones disponibles'); }); document.getElementById('helpBtn').addEventListener('click', ()=>{ alert('Toca un cupón para iniciar canje; confirma para canjear. Toca 3 veces el corazón superior para abrir el panel secreto.'); });
})();

/* expose reset to console if needed */
window.resetAllCupones = clearAll;

</script>
</body>
</html>
