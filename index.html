<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cuponera del Amor 2.5</title>
<style>
/* ======================
   ESTILOS GENERALES
   ====================== */
html, body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: #fff0f6;
  overflow-x: hidden;
}

.hidden { display:none; }

/* ======================
   PANTALLA DE CARGA
   ====================== */
#loader {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: linear-gradient(180deg,#ffd6e9,#ffb7d5);
  z-index: 2000;
  animation: fadeOut 1s ease forwards;
  animation-delay: 2.8s;
}

@keyframes fadeOut {
  to { opacity:0; visibility:hidden; }
}

.loader-heart {
  font-size: 60px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.25); }
}

/* ======================
   LOGIN
   ====================== */
#loginScreen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(180deg,#ffe1ef,#ffc0d9,#ffa9ca);
  z-index: 1500;
  opacity: 0;
  animation: fadeIn 1.2s ease forwards;
  animation-delay: 3s;
}

@keyframes fadeIn { to { opacity:1; } }

.login-box {
  background: #ffffffcc;
  padding: 20px 30px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  backdrop-filter: blur(6px);
}

.login-box h2 {
  margin: 0 0 10px;
  color: #d8006b;
}

.login-input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ff96c0;
}

.login-btn {
  margin-top: 14px;
  width: 100%;
  padding: 10px;
  background: #ff4d88;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.login-btn:hover { transform: scale(1.03); }

/* mensajes flotantes suaves */
.floating-text {
  position: fixed;
  color: #ff78a8;
  font-weight: 700;
  opacity: 0.25;
  animation: floatMsg 10s linear infinite;
  pointer-events: none;
  z-index: 100;
  font-size: 22px;
}

@keyframes floatMsg {
  0% { transform: translateY(0) translateX(0); }
  100% { transform: translateY(-120vh) translateX(30px); }
}

/* ======================
   MENSAJE DE BIENVENIDA
   ====================== */
#welcomeScreen {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  z-index: 1400;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s;
}

#welcomeScreen.show {
  opacity: 1;
  pointer-events: all;
}

/* ======================
   CUPOnerA PRINCIPAL
   ====================== */
#app {
  display:none;
  padding: 20px;
  max-width: 1100px;
  margin: auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
  gap: 15px;
  margin-top: 20px;
}

.card {
  background: #fff;
  padding: 15px;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  text-align: center;
  transition: 0.25s;
}

.card:hover {
  transform: translateY(-4px);
}

.btn-claim {
  width:100%;
  padding: 10px;
  background: #28a745;
  border: none;
  color:#fff;
  border-radius: 10px;
  cursor:pointer;
  font-weight:700;
}

/* ======================
   CANJE ANIMADO
   ====================== */
#redeemPopup {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(6px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align:center;
  z-index: 3000;
  opacity: 0;
  pointer-events:none;
  transition: opacity 0.4s ease;
  font-size:30px;
  font-weight:800;
  color:#d10054;
}

#redeemPopup.show {
  opacity:1;
  pointer-events: all;
}

/* ======================
   MÚSICA
   ====================== */
#audioControls {
  position: fixed;
  bottom: 14px;
  right: 14px;
  z-index: 5000;
}

.music-btn {
  background:#ff4d88;
  border:none;
  padding:12px 16px;
  color:#fff;
  border-radius:50px;
  cursor:pointer;
  font-weight:700;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
}
</style>
</head>
<body>

<!-- ===================== -->
<!--  PANTALLA DE CARGA    -->
<!-- ===================== -->
<div id="loader">
  <div class="loader-heart">❤</div>
  <p style="color:#fff;font-weight:700;margin-top:10px">Cargando amor...</p>
</div>

<!-- ===================== -->
<!--  LOGIN                -->
<!-- ===================== -->
<div id="loginScreen">
  <div class="login-box">
    <h2>Credenciales de la muñequita linda</h2>
    <input id="userInput" class="login-input" placeholder="Usuario" />
    <input id="passInput" class="login-input" placeholder="Contraseña" />
    <button class="login-btn" onclick="attemptLogin()">Entrar</button>
  </div>
</div>

<!-- Mensajes flotantes -->
<div class="floating-text" style="left:10vw; animation-delay:0s">Te Amo ❤</div>
<div class="floating-text" style="left:50vw; animation-delay:4s">Eres mi vida 💗</div>
<div class="floating-text" style="left:75vw; animation-delay:2s">Mi princesa 💖</div>

<!-- ===================== -->
<!--  PANTALLA BIENVENIDA -->
<!-- ===================== -->
<div id="welcomeScreen">
  <h1 style="font-size:38px;color:#d10054">Bienvenida corazón 💖</h1>
  <p style="font-size:20px;margin-top:6px">Ya puedes usar tus cupones</p>
</div>

<!-- ===================== -->
<!--  CUPOnerA            -->
<!-- ===================== -->
<main id="app">
  <h1 style="color:#ff4d88;text-align:center">Cuponera del Amor 2.5</h1>
  <section id="grid" class="grid"></section>
</main>

<!-- ===================== -->
<!-- POPUP CANJE          -->
<!-- ===================== -->
<div id="redeemPopup">¡Canjeado con éxito! ❤</div>

<!-- ===================== -->
<!-- CONTROL DE MÚSICA    -->
<!-- ===================== -->
<div id="audioControls" class="hidden">
  <button class="music-btn" onclick="toggleMusic()">⏸ Música</button>
</div>

<audio id="bgMusic" loop preload="auto"></audio>

<script>
/* ===================
   CONFIGURACIÓN
   =================== */
const MUSIC_URL = "https://docs.google.com/uc?export=download&id=1Dx5JaKuDL3OmWD3sIMhf0SGot2lMjbXB";
const WEBHOOK = "https://discord.com/api/webhooks/1443241851032309854/c-DNoO_Dr8WEDAKtxfrCIt4GALrC_SZDZLqNXgQvrYyFSzC6z98e3wxsYkiRkoXUjlmk";

const NOMBRES = [
  "Tarde de películas juntos",
  "Videojuegos para dos",
  "Pintar cuadros",
  "Día completo de skin care",
  "Masaje con final feliz",
  "Día para consentirte",
  "20 abrazos extra",
  "Un regalo sorpresa",
  "Día donde tú mandas",
  "Un besito especial",
  "Ir al cine",
  "Compras en Temu",
  "Eliges un regalo",
  "Repetir cualquier cupón"
];

let estados = JSON.parse(localStorage.getItem("cuponera_v2_5") || "{}");
NOMBRES.forEach((_,i)=>{ if(!estados[i]) estados[i]="available" });

/* ===================
   LOGIN
   =================== */
function attemptLogin(){
  const u = document.getElementById("userInput").value.trim();
  const p = document.getElementById("passInput").value.trim();

  if(u.toLowerCase()==="sofia" && p==="12/15/2025"){
    document.getElementById("loginScreen").style.display="none";
    showWelcome();
    startMusic();
  } else {
    alert("Credenciales incorrectas mi amorcito ❤️");
  }
}

function showWelcome(){
  const w = document.getElementById("welcomeScreen");
  w.classList.add("show");
  setTimeout(()=>{
    w.classList.remove("show");
    document.getElementById("app").style.display="block";
    document.getElementById("audioControls").classList.remove("hidden");
    renderGrid();
  },3100);
}

/* ===================
   MÚSICA
   =================== */
const bgMusic = document.getElementById("bgMusic");
bgMusic.src = MUSIC_URL;

function startMusic(){ bgMusic.play().catch(()=>{}); }
function toggleMusic(){
  if(bgMusic.paused){ bgMusic.play(); }
  else { bgMusic.pause(); }
}

/* ===================
   RENDER DE CUPOnerA
   =================== */
function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  NOMBRES.forEach((titulo, i)=>{
    const state = estados[i];

    let html = `<div class='card'>
      <h3>${titulo}</h3>
      <p>${state==="redeemed" ? "Canjeado" : "Disponible"}</p>`;

    if(state !== "redeemed")
      html += `<button class='btn-claim' onclick='redeem(${i})'>Canjear</button>`;

    html += `</div>`;
    grid.innerHTML += html;
  });
}

/* ===================
   CANJE + DISCORD
   =================== */
function redeem(i){
  estados[i] = "redeemed";
  localStorage.setItem("cuponera_v2_5", JSON.stringify(estados));
  renderGrid();
  showRedeemPopup();
  notifyDiscord(i);
}

function showRedeemPopup(){
  const pop = document.getElementById("redeemPopup");
  pop.classList.add("show");
  setTimeout(()=> pop.classList.remove("show"), 2200);
}

function notifyDiscord(i){
  const msg = {
    content: `💌 **Cupón canjeado**\n❤ *${NOMBRES[i]}*\n⏰ ${new Date().toLocaleString()}`
  };

  fetch(WEBHOOK, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(msg)
  });
}

</script>
</body>
</html>
