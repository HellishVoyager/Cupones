<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cute Romantic Coupons</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      background: #ffeef4;
      margin: 0;
      padding: 20px;
      color: #444;
      overflow-x: hidden;
    }
    .container {
      max-width: 650px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      text-align: center;
      color: #ff4f8b;
      animation: pop 1s ease-in-out;
    }
    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .coupon {
      background: #ffdef0;
      padding: 15px;
      margin: 15px 0;
      border-radius: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 1s ease;
    }
    button {
      background: #ff4f8b;
      border: none;
      padding: 10px 15px;
      color: white;
      border-radius: 10px;
      cursor: pointer;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      color: #ff4f8b;
      font-size: 20px;
      animation: floatUp 4s linear infinite;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-800px) scale(1.8); opacity: 0; }
    }

    /* Password modal */
    #passwordModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      display: none;
    }
    #passwordBox {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      width: 280px;
    }
    input {
      padding: 8px;
      width: 80%;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .cart {
      margin-top: 30px;
      padding: 20px;
      background: #ffd9e8;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <!-- Floating hearts generator -->
  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "0px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
    setInterval(createHeart, 500);
  </script>

  <!-- Password Modal -->
  <div id="passwordModal">
    <div id="passwordBox">
      <h3>Enter Secret Password 💖</h3>
      <input id="passInput" type="password" placeholder="password" />
      <br>
      <button onclick="checkPassword()">Unlock</button>
      <p id="error" style="color:red;"></p>
    </div>
  </div>

  <div class="container" id="mainContent" style="display:none;">
    <h1>💖 Your Romantic Coupons 💖</h1>
    <div id="couponList"></div>

    <div class="cart">
      <h2>🛒 Shopping Cart</h2>
      <p id="cartText">No coupons claimed yet.</p>
      <p><strong>Total Coupons Used:</strong> <span id="total">0</span></p>
    </div>
  </div>

  <script>
    const PASSWORD = "love123"; // Change this
    const coupons = [
      { id: 1, name: "1 Hug", used: false },
      { id: 2, name: "1 Kiss", used: false },
      { id: 3, name: "Movie Night Together", used: false },
      { id: 4, name: "Breakfast in Bed", used: false }
    ];

    function checkPassword() {
      const input = document.getElementById("passInput").value;
      if (input === PASSWORD) {
        document.getElementById("passwordModal").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      } else {
        document.getElementById("error").textContent = "Wrong password";
      }
    }

    // Load saved states
    const saved = JSON.parse(localStorage.getItem("usedCoupons") || "{}");
    coupons.forEach(c => { if (saved[c.id]) c.used = true; });

    function renderCoupons() {
      const container = document.getElementById("couponList");
      container.innerHTML = "";
      coupons.forEach(c => {
        const div = document.createElement("div");
        div.className = "coupon";
        div.innerHTML = `
          <span><a href="coupon_${c.id}.html">${c.name}</a></span>
          <button onclick="claim(${c.id})" ${c.used ? "disabled" : ""}>
            ${c.used ? "Claimed" : "Claim"}
          </button>
        `;
        container.appendChild(div);
      });
    }

    function claim(id) {
      const coupon = coupons.find(c => c.id === id);
      if (!coupon.used) coupon.used = true;
      localStorage.setItem("usedCoupons", JSON.stringify(coupons.reduce((a,c)=>{a[c.id]=c.used;return a;},{})));
      updateCart();
      renderCoupons();
    }

    function updateCart() {
      const used = coupons.filter(c => c.used);
      document.getElementById("total").textContent = used.length;
      document.getElementById("cartText").innerHTML = used.length > 0 
        ? used.map(u => "• " + u.name).join("<br>")
        : "No coupons claimed yet.";
    }

    renderCoupons();
    updateCart();
  </script>
</body>
</html>
