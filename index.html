<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuponera del Amor</title>
<style>
 body{margin:0;font-family:'Arial',sans-serif;background:#ffe6f2;overflow-x:hidden}
 #pantalla-inicial{position:fixed;inset:0;background:#ffb3d9;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:999}
 #pantalla-inicial h1{font-size:3rem;color:#fff;text-shadow:2px 2px #ff4da6;margin-bottom:30px}
 #ingresarBtn{padding:15px 30px;background:#ff4da6;color:#fff;border:none;font-size:1.5rem;border-radius:20px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2)}
 #ingresarBtn:hover{background:#e60073}
 .heart-big{position:absolute;color:#fff;font-size:40px;animation:floatUp 6s infinite ease-in-out;opacity:.8}
 @keyframes floatUp{0%{transform:translateY(100vh) scale(1);opacity:1}100%{transform:translateY(-20vh) scale(1.4);opacity:0}}
 #contenido{display:none;padding:20px}
 .cupon{background:#fff;border:2px solid #000;border-radius:10px;padding:15px;max-width:380px;margin:20px auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
 .titulo-cupon{font-size:1.2rem;margin:10px 0;font-weight:bold;text-align:center}
 .btn{width:100%;padding:10px;border:none;background:#28a745;color:#fff;font-size:1.1rem;border-radius:8px;cursor:pointer}
 .btn:hover{background:#1e7e34}
 .agotado{background:#cc0033 !important;color:#fff !important;cursor:default}
 .heart{position:fixed;bottom:-10px;color:#ff4da6;font-size:20px;animation:fly 5s linear infinite;opacity:.6}
 @keyframes fly{0%{transform:translateY(0) translateX(0);opacity:1}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
 .admin{margin-top:10px;text-align:center}
 .admin button{font-size:.8rem;border:none;background:#666;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div id="pantalla-inicial">
 <h1>Cuponera del Amor</h1>
 <button id="ingresarBtn">Ingresar</button>
 <div class="heart-big" style="left:10%">❤️</div>
 <div class="heart-big" style="left:40%;animation-delay:1s">💗</div>
 <div class="heart-big" style="left:70%;animation-delay:2s">💖</div>
</div>
<div id="contenido"></div>
<script>
 const cupones=[
 "Para una tarde de películas",
 "Para una tarde de videojuegos",
 "Para pintar cuadros",
 "Para un día de skin care",
 "Para un masaje con final feliz",
 "Para consentirte un día",
 "Válido por 20 abrazos",
 "Para un regalo",
 "Por un día hacer lo que quieras",
 "Por un besito",
 "Para ir al cine",
 "Compras en Temu",
 "Comprarte lo que quieras",
 "Repetir cualquier cupón"
 ];
 document.getElementById("ingresarBtn").onclick=function(){pantalla-inicial.style.display="none";contenido.style.display="block";renderCupones();};
 function renderCupones(){contenido.innerHTML="";
 cupones.forEach((texto,i)=>{
 const estado=localStorage.getItem("cupon_"+i)||"canjear";
 const div=document.createElement("div");div.className="cupon";
 const titulo=document.createElement("div");titulo.className="titulo-cupon";titulo.textContent=texto;
 const btn=document.createElement("button");btn.className="btn";btn.id="btn"+i;
 if(estado==="canjear"){btn.textContent="Canjear"}
 if(estado==="confirmar"){btn.textContent="Confirmar"}
 if(estado==="agotado"){btn.textContent="Agotado ❤️";btn.classList.add("agotado")}
 btn.onclick=function(){manejar(i)};
 const admin=document.createElement("div");admin.className="admin";
 const reset=document.createElement("button");reset.textContent="Re-stock";
 reset.onclick=function(){localStorage.setItem("cupon_"+i,"canjear");renderCupones();};
 admin.appendChild(reset);
 div.appendChild(titulo);
 div.appendChild(btn);
 div.appendChild(admin);
 contenido.appendChild(div);
 });}
 function manejar(i){let estado=localStorage.getItem("cupon_"+i)||"canjear";
 if(estado==="canjear"){localStorage.setItem("cupon_"+i,"confirmar")}
 else if(estado==="confirmar"){localStorage.setItem("cupon_"+i,"agotado")}
 renderCupones();}
 function crearCorazon(){const heart=document.createElement("div");heart.className="heart";heart.textContent="❤️";heart.style.left=Math.random()*100+"vw";heart.style.fontSize=(15+Math.random()*20)+"px";document.body.appendChild(heart);setTimeout(()=>heart.remove(),5000);}setInterval(crearCorazon,500);
</script>
</body>
</html>
