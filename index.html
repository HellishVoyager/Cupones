<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuponera del Amor</title>
<style>
body {
margin: 0;
font-family: 'Poppins', sans-serif;
background: #ffe6ec;
color: #333;
}


.pantalla-inicio {
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
background: #ffd1dc;
transition: opacity 0.7s ease;
}


.titulo {
font-size: 3rem;
font-weight: bold;
color: #ff4d6d;
display: flex;
gap: 10px;
align-items: center;
}


.corazon {
font-size: 3.2rem;
color: #ff1e48;
}


.btn-ingresar {
margin-top: 30px;
padding: 15px 40px;
font-size: 1.3rem;
background: #ff4d6d;
color: white;
border: none;
border-radius: 12px;
cursor: pointer;
transition: 0.3s;
}


.btn-ingresar:hover {
transform: scale(1.05);
}


.contenedor-cupones {
display: none;
padding: 20px;
}


</html>
